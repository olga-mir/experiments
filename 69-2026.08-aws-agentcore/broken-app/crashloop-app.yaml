apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: demo
  labels:
    app: payments-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-worker
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      containers:
        - name: payments-worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - >
              echo "starting payments-worker...";
              sleep 2;
              echo "FATAL: could not connect to database at db.internal:5432 - connection refused" >&2;
              exit 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
