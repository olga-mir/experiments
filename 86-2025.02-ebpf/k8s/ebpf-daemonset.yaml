---
apiVersion: v1
kind: Namespace
metadata:
  name: test-ebpf
spec:
  finalizers:
  - kubernetes
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-ds
  namespace: test-ebpf
spec:
  selector:
    matchLabels:
      app: ebpf-ds
  template:
    metadata:
      labels:
        app: ebpf-ds
    spec:
      hostPID: true  # Required to access host syscalls
      nodeSelector:
        workload: noisy-node
      tolerations:
      - key: "dedicated"
        operator: "Equal"
        value: "noisy-node"
        effect: "NoSchedule"

      containers:
      - name: ebpf-ds
        image: ${IMAGE}
        ports:
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        # Node PSI: psi.go reads <PSI_PROC_PATH>/{cpu,io,memory}. Point it at the
        # host's /proc/pressure, mounted below (the pod's own /proc is the
        # container's, not the node's).
        - name: PSI_PROC_PATH
          value: /host/proc/pressure
        securityContext:
          privileged: true  # Required for eBPF operations
        volumeMounts:
        - name: sys-kernel-debug
          mountPath: /sys/kernel/debug
        - name: sys-fs-cgroup
          mountPath: /sys/fs/cgroup
          readOnly: true
        - name: host-proc-pressure
          mountPath: /host/proc/pressure
          readOnly: true
      volumes:
      - name: sys-kernel-debug
        hostPath:
          path: /sys/kernel/debug
      - name: sys-fs-cgroup
        hostPath:
          path: /sys/fs/cgroup
      - name: host-proc-pressure
        # Requires PSI enabled in the node kernel (CONFIG_PSI=y, psi=1 boot arg).
        # GKE COS nodes have it on by default.
        hostPath:
          path: /proc/pressure
